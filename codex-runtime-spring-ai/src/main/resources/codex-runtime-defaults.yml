logging:
  level:
    io.netty.resolver.dns.DnsServerAddressStreamProviders: ERROR
    org.springframework.ai.openai.metadata.support.OpenAiResponseHeaderExtractor: ERROR

spring:
  ai:
    chat:
      client:
        observations:
          log-prompt: ${CODEX_CHAT_LOG_PROMPT:false}
          log-completion: ${CODEX_CHAT_LOG_COMPLETION:false}
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${CODEX_CHAT_MODEL:gpt-5.4}
          temperature: ${CODEX_TEMPERATURE:0.2}
codex:
  agent:
    max-depth: ${CODEX_AGENT_MAX_DEPTH:4}
  model:
    context-window: ${CODEX_CONTEXT_WINDOW:272000}
    auto-compact-token-limit: ${CODEX_AUTO_COMPACT_TOKEN_LIMIT:200000}
    emit-raw-output-items: ${CODEX_EMIT_RAW_OUTPUT_ITEMS:false}
    reasoning-effort: ${CODEX_REASONING_EFFORT:}
    reasoning-summary-mode: ${CODEX_REASONING_SUMMARY_MODE:}
    transport-mode: ${CODEX_MODEL_TRANSPORT_MODE:chat-fallback}
    responses-store: ${CODEX_RESPONSES_STORE:true}
    responses-emit-tools: ${CODEX_RESPONSES_EMIT_TOOLS:false}
  prompt:
    project-doc-max-bytes: ${CODEX_PROJECT_DOC_MAX_BYTES:32768}
    base-instructions-text: ${CODEX_BASE_INSTRUCTIONS_TEXT:}
    base-instructions-file: ${CODEX_BASE_INSTRUCTIONS_FILE:}
    project-instructions-text: ${CODEX_PROJECT_INSTRUCTIONS_TEXT:}
    project-instructions-file: ${CODEX_PROJECT_INSTRUCTIONS_FILE:}
    user-instructions-text: ${CODEX_USER_INSTRUCTIONS_TEXT:}
    user-instructions-file: ${CODEX_USER_INSTRUCTIONS_FILE:}
